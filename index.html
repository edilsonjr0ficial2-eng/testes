<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Vitale - Meus Eventos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand-yellow: #FFCC00; /* Amarelo vibrante */
      --brand-black: #111111;  /* Preto profundo */
      --bg-color: #f4f7fc;
      --text-dark: #222;
      --text-gray: #777;
      --border-color: #e0e0e0;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: linear-gradient(#e5eaf5 1px, transparent 1px), linear-gradient(90deg, #e5eaf5 1px, transparent 1px);
      background-size: 20px 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho Superior */
    header {
      background-color: var(--brand-black);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--brand-yellow); /* Logo em destaque */
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .avatar {
      width: 32px;
      height: 32px;
      background-color: var(--brand-black);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid var(--brand-yellow);
      color: var(--brand-yellow);
      font-weight: bold;
    }

    /* Menu de Navegação Superior (Tabs) */
    .top-nav {
      display: flex;
      background: white;
      border-bottom: 1px solid var(--border-color);
    }
    .top-nav-item {
      flex: 1;
      text-align: center;
      padding: 15px 0;
      color: var(--text-gray);
      font-size: 14px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .top-nav-item.active {
      color: var(--brand-black);
      font-weight: bold;
      border-bottom: 3px solid var(--brand-yellow);
    }

    /* Área de Conteúdo Central */
    .content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .btn-criar {
      background-color: var(--brand-yellow);
      color: var(--brand-black);
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-bottom: 20px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    /* Botões de Alternância (Ativos / Arquivados) */
    .toggle-group {
      display: flex;
      background-color: #e5eaf5;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .toggle-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .toggle-btn.active {
      background-color: var(--brand-black);
      color: var(--brand-yellow);
    }
    .toggle-btn:not(.active) {
      color: var(--text-gray);
    }

    /* Estado Vazio (Troféu Cortado) */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      color: #333;
      margin-top: 20px;
    }
    .empty-state-icon {
      position: relative;
      margin-bottom: 15px;
    }
    .empty-state-icon i {
      font-size: 80px;
      color: #d1d5db;
    }
    .empty-state-icon::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 4px;
      background-color: #d1d5db;
      top: 50%;
      left: -15px;
      transform: rotate(-45deg);
      border-radius: 2px;
    }
    .empty-state h3 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    /* Menu de Navegação Inferior Flutuante */
    .bottom-nav-container {
      padding: 10px 20px 20px;
      position: fixed;
      bottom: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background-color: white;
      padding: 10px 0;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-gray);
      text-decoration: none;
      flex: 1;
    }
    .bottom-nav-item.active .icon-bg {
      background-color: var(--brand-yellow);
      color: var(--brand-black);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }
    .icon-bg {
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bottom-nav-item i {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-table-tennis-paddle-ball"></i> Arena Vitale
    </div>
    <div class="user-info">
      E aí, EDILSON?!
      <div class="avatar">E</div>
    </div>
  </header>

  <!-- Navegação de Tabs -->
  <div class="top-nav">
    <a href="#" class="top-nav-item">
      <i class="fa-regular fa-calendar"></i>
      Eventos
    </a>
    <a href="#" class="top-nav-item active">
      <i class="fa-regular fa-user"></i>
      Meus eventos
    </a>
    <a href="#" class="top-nav-item">
      <i class="fa-solid fa-trophy"></i>
      Circuitos
    </a>
  </div>

  <!-- Conteúdo Central -->
  <div class="content">
    <button class="btn-criar">
      <i class="fa-solid fa-plus"></i> Criar Evento
    </button>

    <div class="toggle-group">
      <div class="toggle-btn active">Ativos</div>
      <div class="toggle-btn">Arquivados</div>
    </div>

    <!-- Feedback Visual Sem Eventos -->
    <div class="empty-state">
      <div class="empty-state-icon">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h3>Você não possui nenhum evento cadastrado</h3>
    </div>
  </div>

  <!-- Navegação Inferior -->
  <div class="bottom-nav-container">
    <div class="bottom-nav">
      <a href="#" class="bottom-nav-item">
        <div class="icon-bg"><i class="fa-solid fa-house"></i></div>
        Início
      </a>
      <a href="#" class="bottom-nav-item">
        <div class="icon-bg"><i class="fa-regular fa-calendar-check"></i></div>
        Reservas
      </a>
      <a href="#" class="bottom-nav-item active">
        <div class="icon-bg"><i class="fa-solid fa-trophy"></i></div>
        Eventos
      </a>
      <a href="#" class="bottom-nav-item">
        <div class="icon-bg"><i class="fa-solid fa-gear"></i></div>
        Ajustes
      </a>
    </div>
  </div>

</body>
</html>
