<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio de Raquete - Arena Vitale</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #ff6b6b; }
        p { color: #555; font-size: 14px; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { background-color: #ff4757; }
        #resultado {
            margin-top: 20px;
            display: none;
            padding: 15px;
            background: #e3f2fd;
            border: 2px dashed #2196f3;
            border-radius: 5px;
        }
        .cupom-destaque {
            font-size: 24px;
            font-weight: bold;
            color: #2196f3;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sorteio Arena Vitale</h2>
    <p>Cadastre-se para gerar seu cupom e concorrer a uma raquete exclusiva! Válido apenas para clientes com horários reservados.</p>
    
    <form id="formSorteio">
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="date" id="nascimento" required>
        <input type="tel" id="telefone" placeholder="Telefone / WhatsApp" required>
        <button type="submit">Gerar Meu Cupom</button>
    </form>

    <div id="resultado">
        <p>Parabéns! Seu cupom da sorte é:</p>
        <div class="cupom-destaque" id="codigoCupom"></div>
        <p style="font-size: 12px; margin-top: 10px;">Tire um print desta tela. O prêmio só será entregue mediante validação da reserva no sistema.</p>
    </div>
</div>

<script>
    document.getElementById('formSorteio').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita que a página recarregue

        // Pega os dados digitados
        const nome = document.getElementById('nome').value;
        const nascimento = document.getElementById('nascimento').value;
        const telefone = document.getElementById('telefone').value;

        // Gera um cupom aleatório (Ex: VITALE-A8F2)
        const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let codigo = 'VITALE-';
        for (let i = 0; i < 4; i++) {
            codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
        }

        // Exibe o cupom na tela
        document.getElementById('formSorteio').style.display = 'none';
        document.getElementById('resultado').style.display = 'block';
        document.getElementById('codigoCupom').innerText = codigo;

        // AQUI ENTRA A INTEGRAÇÃO COM O GOOGLE SHEETS
        // Você enviará as variáveis: nome, nascimento, telefone e codigo para sua planilha.
        console.log("Dados para salvar:", {nome, nascimento, telefone, codigo});
    });
</script>

</body>
</html>
